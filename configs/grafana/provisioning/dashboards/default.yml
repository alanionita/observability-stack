apiVersion: 1

providers:
  - name: dashboards
    type: file
    updateIntervalSeconds: 30
    editable: true          # Allows UI edits
    disableDeletion: false  # Blocks UI deletion
    allowUiUpdates: false   # Blocks UI updates
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
