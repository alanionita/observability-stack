apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    orgId: 1
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 3.3.0
      cacheLevel: 'High'
      disableRecordingRules: false
      seriesEndpoint: false
      timeInterval: 15s     # Prometheus scrape interval
      incrementalQuery: true    # [beta] allows incremental queries, get the new results only and attach to cached results
      incrementalQueryOverlapWindow: 10m